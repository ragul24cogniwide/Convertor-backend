version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: convertor-backend:latest
    container_name: convertor-backend
    restart: unless-stopped
    ports:
      - "8103:8000"
    environment:
      - APP_ENV=production
      - MAX_FILE_SIZE_MB=100
      - TEMP_FILE_TTL_MINUTES=30
      - CLEANUP_INTERVAL_MINUTES=5
      - CONVERSION_TIMEOUT_SECONDS=120
      - CORS_ORIGINS=http://20.235.56.85:3221,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      - temp_storage:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 12s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - convertor-net

volumes:
  temp_storage:

networks:
  convertor-net:
    name: convertor-network
